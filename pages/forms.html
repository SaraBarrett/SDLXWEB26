<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h3>Race Registration!</h3>
    <form action="">
      <label for="f-name">First Name</label> <input type="text" id="f-name" />
      <label for="l-name">Last Name</label> <input type="text" id="l-name" />
      <div>
        <input type="radio" id="fun" name="fun" value="fun" checked />
        <label for="fun">Fun Run</label>
      </div>

      <div>
        <input type="radio" id="half" name="half" value="half" />
        <label for="half">Half Marathon</label>
      </div>

      <div>
        <input type="radio" id="full" name="full" value="full" />
        <label for="full">Full Marathon</label>
      </div>
      <br />
      <label for="email">Email</label> <input type="email" id="email" />
      <label for="password">Password</label>
      <input type="password" id="password" />
      <br />
      <label for="age-group">Choose a age group:</label>

      <select name="age-group" id="age-group" required>
        <option value="">--Please choose an option--</option>
        <option value="18">under 18</option>
        <option value="30">under 30</option>
        <option value="50">under 50</option>
        <option value="other">Other</option>
      </select>

      <button type="submit">Register</button>
  
    </form>
  </body>
</html>
