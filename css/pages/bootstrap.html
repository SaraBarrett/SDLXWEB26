<!doctype html>
<html>
  <head>
    <title>Bootstrap Buttons Exercise</title>
    <!--INCLUDING BOOTSTRAP-->
    <link href="../css/bootstrap.css" rel="stylesheet" />
  </head>
  <body>
    <section class="container mt-3 w-50 w-sm-50 w-md-25">
      <h1 class="text-light bg-dark text-center">Bad News</h1>

      <div class="alert alert-warning" role="alert">
        You are going to die one day! It sucks, but it's normal :(
      </div>

      <button class="btn-success btn">Come To Terms With</button>
      <button class="btn btn-danger">Continue To Deny</button>
    </section>

    <!-- grid -->
    <section class="mt-5">
      <div class="container text-center">
        <div class="row">
          <div class="col-6 col-sm-6 col-md-4 bg-success">Column</div>
          <div class="col-6 col-sm-6 col-md-4 bg-secondary">Column</div>
          <div class="col-6 col-sm-6 col-md-4 bg-success">Column</div>
        </div>
      </div>
    </section>
  </body>
</html>
